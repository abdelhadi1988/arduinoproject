<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            text-align: center;
            font-family: sans-serif;
            padding-top: 50px;
        }
        
        /* تأثير الحركة للعنوان */
        .moving-text {
            font-size: 30px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); color: #ffcc00; }
            50% { transform: scale(1.1); color: white; }
            100% { transform: scale(1); color: #ffcc00; }
        }
    </style>
</head>
<body>

    <h1 class="moving-text">فار فار عبد الهادي</h1>
    <p>مرحباً بك في عالم البرمجة الاحترافي</p>

</body>
</html>
